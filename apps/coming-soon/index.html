<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Djanora | Coming Soon</title>
    <meta
      name="description"
      content="Djanora helps you plan your event — budget, vendors, guests, and the day-of schedule — all in one place. Coming soon."
    />
    <meta name="theme-color" content="#fafafa" />
    <link rel="canonical" href="https://djanora.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_CA" />
    <meta property="og:url" content="https://djanora.com/" />
    <meta property="og:site_name" content="Djanora" />
    <meta property="og:title" content="Djanora — Coming Soon" />
    <meta
      property="og:description"
      content="Plan your event with budget, vendors, guests, and the day-of schedule in one place."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%2318181b'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='16' font-family='Georgia,serif' font-weight='700' fill='%23fff'%3ED%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --foreground: #18181b;
        --muted: #52525b;
        --border: #e4e4e7;
        --background: #fafafa;
        --card: #ffffff;
        --primary: #18181b;
        --primary-foreground: #ffffff;
        --font-sans: Geist, system-ui, sans-serif;
        --font-display: "Playfair Display", Georgia, serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --foreground: #fafafa;
          --muted: #a1a1aa;
          --border: #27272a;
          --background: #09090b;
          --card: #18181b;
          --primary: #fafafa;
          --primary-foreground: #18181b;
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
        color-scheme: light dark;
      }

      body {
        background: var(--background);
        color: var(--foreground);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }

      .skip {
        position: absolute;
        left: 12px;
        top: -40px;
        background: var(--foreground);
        color: var(--background);
        padding: 8px 12px;
        border-radius: 8px;
        z-index: 10;
      }

      .skip:focus {
        top: 12px;
      }

      :focus-visible {
        outline: 2px solid var(--foreground);
        outline-offset: 2px;
      }

      .pattern {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle at 1px 1px, #a1a1aa 1px, transparent 0);
        background-size: 24px 24px;
        opacity: 0.4;
        pointer-events: none;
      }

      .fade {
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom, var(--background), transparent 40%, var(--background));
        pointer-events: none;
      }

      header {
        position: relative;
        z-index: 1;
        max-width: 72rem;
        margin: 0 auto;
        padding: 1.25rem 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .logo-mark {
        width: 2rem;
        height: 2rem;
        border-radius: 999px;
        background: var(--foreground);
        color: var(--background);
        display: grid;
        place-items: center;
        font-size: 0.875rem;
        font-weight: 700;
      }

      .logo-word {
        font-family: var(--font-display);
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--foreground);
      }

      main {
        position: relative;
        min-height: calc(100vh - 8rem);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4rem 1.5rem 6rem;
        text-align: center;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        background: var(--card);
        color: var(--muted);
        border: 1px solid var(--border);
        font-size: 0.75rem;
        font-weight: 500;
        padding: 0.4rem 0.75rem;
        border-radius: 999px;
        margin-bottom: 1.5rem;
      }

      h1 {
        font-family: var(--font-display);
        font-size: clamp(3rem, 8vw, 4.5rem);
        font-weight: 600;
        line-height: 1.1;
        margin-bottom: 1.5rem;
      }

      h1 span {
        color: inherit;
      }

      .lede {
        font-size: 1.125rem;
        line-height: 1.7;
        color: var(--muted);
        max-width: 36rem;
        margin: 0 auto;
      }

      footer {
        padding: 1.5rem;
        text-align: center;
        color: var(--muted);
        font-size: 0.8rem;
        border-top: 1px solid var(--border);
      }

      footer a {
        color: var(--foreground);
        text-decoration: none;
      }

      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header>
      <span class="logo-mark" aria-hidden="true">D</span>
      <span class="logo-word">Djanora</span>
    </header>
    <main id="main">
      <div class="pattern" aria-hidden="true"></div>
      <div class="fade" aria-hidden="true"></div>
      <div style="position: relative">
        <p class="badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
            <circle cx="12" cy="10" r="3" />
          </svg>
          Ottawa, Ontario — event planning
        </p>
        <h1>Coming <span>Soon</span></h1>
        <p class="lede">
          Djanora helps you plan your event — budget, vendors, guests, and the day-of schedule —
          all in one place.
        </p>
      </div>
    </main>
    <footer>
      <p>&copy; <span id="year"></span> Djanora · <a href="mailto:contact@djanora.com">contact@djanora.com</a></p>
    </footer>
    <script>
      document.getElementById("year").textContent = String(new Date().getFullYear())
    </script>
  </body>
</html>
