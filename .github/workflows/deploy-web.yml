# Deploys apps/web (Next standalone) → Azure Web App test-djanora-fe
#
# Required GitHub secrets / variables:
#   AZUREAPPSERVICE_PUBLISHPROFILE_03E1EA2446DA476CA72C509E6F6F18B7
#   vars.NEXT_PUBLIC_API_URL          e.g. https://test-djanora.azurewebsites.net
#   secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
# Runtime env on the Azure app: CLERK_SECRET_KEY and the same NEXT_PUBLIC_* values.

name: Deploy Web

on:
  push:
    branches: [main, test]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check public build env
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "Set repository variable NEXT_PUBLIC_API_URL (your Nest public URL)."
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" ]; then
            echo "Set repository secret NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY."
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
          NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /
          NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /onboarding
        run: npm run build --workspace=web

      - name: Pack standalone bundle
        run: |
          set -euo pipefail
          STANDALONE=apps/web/.next/standalone
          if [ ! -d "$STANDALONE" ]; then
            echo "Next standalone output missing. next.config.ts must set output: 'standalone'."
            exit 1
          fi
          if [ -f "$STANDALONE/apps/web/server.js" ]; then
            mkdir -p "$STANDALONE/apps/web/.next"
            cp -R apps/web/.next/static "$STANDALONE/apps/web/.next/static"
            if [ -d apps/web/public ]; then
              cp -R apps/web/public "$STANDALONE/apps/web/public"
            fi
            printf '%s\n' '{"name":"web","private":true,"scripts":{"start":"node apps/web/server.js"}}' > "$STANDALONE/package.json"
          elif [ -f "$STANDALONE/server.js" ]; then
            mkdir -p "$STANDALONE/.next"
            cp -R apps/web/.next/static "$STANDALONE/.next/static"
            if [ -d apps/web/public ]; then
              cp -R apps/web/public "$STANDALONE/public"
            fi
            printf '%s\n' '{"name":"web","private":true,"scripts":{"start":"node server.js"}}' > "$STANDALONE/package.json"
          else
            echo "Could not find server.js under $STANDALONE"
            find "$STANDALONE" -name 'server.js' | head
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: apps/web/.next/standalone
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: test-djanora-fe
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-app
          path: ./web-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: test-djanora-fe
          slot-name: Production
          package: ./web-app
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_03E1EA2446DA476CA72C509E6F6F18B7 }}
