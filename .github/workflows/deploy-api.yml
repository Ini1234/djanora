# Deploys apps/api → Azure Web App test-djanora
#
# Test only. Push to main does not deploy here (prod is coming-soon / tags).
#
# Required GitHub secret:
#   AZUREAPPSERVICE_PUBLISHPROFILE_A20C9377A1E64FA495F5219F5618391A
# Runtime env (set on the Azure app, not here): DATABASE_URL, WEB_URL,
#   NEXT_PUBLIC_API_URL, CLERK_*, RESEND_*, AZURE_STORAGE_* (account + per-kind containers), etc.

name: Deploy API

on:
  push:
    branches: [test]
    paths:
      - 'apps/api/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/deploy-api.yml'
      - '.github/deployment.ini'
  workflow_dispatch:

# OneDeploy 409s if two zips hit the same app. Queue, do not cancel — cancelling
# a live Kudu deploy leaves the lock that causes the next 409.
concurrency:
  group: deploy-api-test-djanora
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: npx prisma generate

      - name: Build
        run: |
          npm run build --workspace=api
          if [ ! -f apps/api/dist/main.js ]; then
            echo "expected apps/api/dist/main.js after nest build" >&2
            find apps/api/dist -name 'main.js' || true
            exit 1
          fi

      - name: Hardening tests
        run: npm run test:hardening

      - name: Pack deploy bundle
        run: |
          set -euo pipefail
          mkdir -p .deploy/api
          cp apps/api/package.json .deploy/api/
          cp -R apps/api/dist .deploy/api/dist
          cp -R apps/api/prisma .deploy/api/prisma
          cp apps/api/prisma.config.ts .deploy/api/
          cp apps/api/azure-start.sh .deploy/api/start.sh
          chmod +x .deploy/api/start.sh
          cp .github/deployment.ini .deploy/api/.deployment
          mkdir -p .deploy/api/uploads
          node -e "const p=require('./.deploy/api/package.json'); p.scripts.start='sh start.sh'; require('fs').writeFileSync('./.deploy/api/package.json', JSON.stringify(p,null,2))"
          cd .deploy/api
          npm install --omit=dev --ignore-scripts
          if [ ! -f node_modules/prisma/build/index.js ]; then
            echo "expected node_modules/prisma/build/index.js after npm install" >&2
            ls -la node_modules/prisma node_modules/prisma/build node_modules/.bin/prisma 2>/dev/null || true
            exit 1
          fi
          DATABASE_URL=postgresql://ci:ci@127.0.0.1:5432/ci node node_modules/prisma/build/index.js generate

      - uses: actions/upload-artifact@v4
        with:
          name: api-app
          path: .deploy/api
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: test-djanora
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api-app
          path: ./api-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: test-djanora
          slot-name: Production
          package: ./api-app
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_A20C9377A1E64FA495F5219F5618391A }}
