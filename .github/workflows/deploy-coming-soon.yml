# Deploys apps/coming-soon → Azure Static Web App (prod domain)
#
# Runs on merge/push to prod, or manual Run workflow.
# Push to main/test does not deploy here (those stay on test-djanora-fe).
#
# Required GitHub secret:
#   AZURE_STATIC_WEB_APPS_API_TOKEN
# Create the Static Web App in Azure (name: djanora), then copy Deployment token
# from Overview / Manage deployment token into that secret.
#
# Custom domain (after first successful deploy):
#   Azure → Static Web App djanora → Custom domains
#   Add www.djanora.com (CNAME → the azurestaticapps.net host)
#   Add djanora.com (ALIAS/ANAME or A record as Azure shows)
#   Validate TXT, wait for SSL. Leave test-djanora*.azurewebsites.net alone.

name: Deploy Coming Soon

on:
  workflow_dispatch:
  push:
    branches: [prod]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    environment: djanora-prod
    steps:
      - uses: actions/checkout@v4

      - name: Deploy static coming soon
        uses: Azure/static-web-apps-deploy@v1
        env:
          # Static HTML only. Oryx still reads repo .nvmrc/engines unless this is off.
          ENABLE_ORYX_BUILD: false
          SKIP_APP_BUILD: true
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: apps/coming-soon
          output_location: ''
          skip_app_build: true
          skip_api_build: true
